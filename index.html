<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3A4AA6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="細節實驗室">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<title>細節實驗室：醫檢師養成計畫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F3EC; --card:#fff; --ink:#22212B; --muted:#6C6878; --line:#E6E0D3;
  --pri:#3A4AA6; --pri-soft:#E6E9F8; --acc:#F0A23B; --acc-soft:#FDF0DA;
  --ok:#2C9A68; --ok-soft:#E0F3E9; --bad:#CF4C47; --bad-soft:#FBE5E4;
  --gold:#E2A511; --silver:#9AA3B2;
  --r1:#E9566A; --r1s:#FCE8EB; --r2:#3A4AA6; --r2s:#E6E9F8; --r3:#2C9A68; --r3s:#E0F3E9;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:rgba(246,243,236,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px}
.logo{font-weight:900;font-size:19px;color:var(--pri);border:0;background:none;padding:0;display:flex;align-items:center;gap:6px}
.logo small{font-size:11px;font-weight:700;color:var(--acc);border:1.5px solid var(--acc);border-radius:6px;padding:0 5px}
.top .sp{flex:1}
.tb{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--muted)}
.tb.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:720px;margin:0 auto;padding:16px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
h2{font-size:21px;margin:2px 0 12px} h3{font-size:16px;margin:0 0 10px}
.muted{color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:13px;padding:12px 18px;font-weight:700;background:var(--pri);color:#fff;min-height:48px}
.btn.ghost{background:var(--pri-soft);color:var(--pri)} .btn.acc{background:var(--acc);color:#3a2600}
.btn.warn{background:var(--bad-soft);color:var(--bad)} .btn.sm{padding:6px 12px;min-height:34px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default} .full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-weight:500}
.chip.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri);font-weight:700}
label.f{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input[type=text],input[type=number],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;font-size:16px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri)}
.note{background:var(--acc-soft);border-radius:12px;padding:12px;font-size:14px;margin-bottom:14px}
/* hall */
.hero{background:linear-gradient(135deg,#3A4AA6,#5161C0);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero h2{margin:0 0 4px;font-size:22px}
.hero .who{opacity:.9;font-size:14px}
.hero .stats{display:flex;gap:10px;margin-top:14px}
.hero .stats div{background:rgba(255,255,255,.16);border-radius:14px;padding:8px 12px;flex:1;text-align:center}
.hero .stats b{display:block;font-size:22px}
.hero .stats small{font-size:12px;opacity:.85}
.hero svg.mascot{position:absolute;right:10px;top:8px;width:74px;height:74px;opacity:.95}
.plan{background:#EDE8DC;border-radius:22px;padding:12px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;gap:10px;position:relative}
.plan .corr{grid-column:1/3;background:repeating-linear-gradient(90deg,#E2DCCD 0 22px,#E8E2D4 22px 44px);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--muted);text-align:center;font-weight:700;letter-spacing:2px}
.room{border:0;border-radius:18px;padding:0;text-align:left;position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 3px 0 rgba(0,0,0,.08);background:#fff;transition:transform .15s}
.room:active{transform:scale(.98)}
.room .scene{display:block;width:100%;height:auto}
.room .info{padding:10px 12px 12px;display:block}
.room b{font-size:16px;display:block;color:var(--ink)}
.room small{font-size:12px;color:var(--muted)}
.room .bar{display:block;height:6px;background:rgba(0,0,0,.08);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.room .bar i{display:block;height:100%;border-radius:99px}
.room .badge{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.92);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:900}
.room.big{grid-column:1/3;flex-direction:row;align-items:stretch}
.room.big .scene{width:62%;flex:none}
.room.big .info{display:flex;flex-direction:column;justify-content:center}
@media (max-width:420px){.room.big{flex-direction:column}.room.big .scene{width:100%}}
.halls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.hbtn{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px;text-align:left}
.hbtn b{display:block} .hbtn small{color:var(--muted);font-size:12px}
/* room */
.path{position:relative;padding:6px 0}
.lv{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:12px;text-align:left}
.lv .num{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:18px;flex:none;color:#fff}
.lv .t{flex:1;min-width:0} .lv .t b{display:block;font-size:16px} .lv .t small{color:var(--muted)}
.stamp{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;flex:none;border:2.5px dashed var(--line);color:var(--line)}
.stamp.silver{border:2.5px solid var(--silver);color:var(--silver);background:#F2F4F7;transform:rotate(-12deg)}
.stamp.gold{border:2.5px solid var(--gold);color:var(--gold);background:#FFF7DE;transform:rotate(-12deg)}
/* play */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.prog{flex:1;height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .3s}
.stars{font-weight:900;color:var(--gold);white-space:nowrap}
.imgbox{background:#111;border-radius:16px;overflow:hidden;position:relative;line-height:0}
.imgbox img{width:100%;display:block;max-height:58vh;object-fit:contain}
.imgbox .hint{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px 8px;border-radius:99px;line-height:1.4}
.spotwrap{position:relative;display:inline-block;width:100%;line-height:0;background:#111;border-radius:16px;overflow:hidden;cursor:crosshair}
.spotwrap img{width:100%;display:block}
.mark{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border:3px solid var(--acc);border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.35);pointer-events:none}
.mark.ans{border-color:var(--ok);border-style:dashed}
.prompt{font-size:18px;font-weight:700;margin:14px 0 4px;line-height:1.5}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px;text-align:left;font-size:17px;font-weight:500;min-height:54px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:#14583b;font-weight:700}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);color:#8a2420}
.opt.gone{opacity:.25;text-decoration:line-through}
.opt:disabled{cursor:default}
.seq{min-height:54px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;margin-top:12px}
.seq .it{background:var(--pri-soft);color:var(--pri);border-radius:10px;padding:8px 10px;font-weight:700;font-size:15px}
.seq .ph{color:var(--muted);font-size:14px;padding:8px}
.fb{border-radius:14px;padding:14px;margin-top:12px;line-height:1.6}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)} .fb.tip{background:var(--acc-soft)}
.fb b{display:block;margin-bottom:2px}
.toolrow{display:flex;gap:10px;margin-top:12px}
.done{text-align:center}
.done .big{font-size:46px;font-weight:900;color:var(--pri);line-height:1.1}
.bigstamp{width:110px;height:110px;margin:6px auto 8px;font-size:15px;border-width:4px!important}
@keyframes thump{0%{transform:scale(2.2) rotate(-30deg);opacity:0}60%{transform:scale(.92) rotate(-12deg);opacity:1}100%{transform:scale(1) rotate(-12deg)}}
.thump{animation:thump .5s cubic-bezier(.3,1.4,.6,1)}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.pop{animation:pop .25s ease}
.wl{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);text-align:left}
.wl img{width:64px;height:48px;object-fit:cover;border-radius:8px;background:#111;flex:none}
/* cert */
.cert{background:#FFFDF7;border:3px double var(--gold);border-radius:18px;padding:26px 18px;text-align:center;position:relative}
.cert h2{font-size:26px;letter-spacing:4px;color:#7A5A00;margin:4px 0}
.cert .nm{font-size:30px;font-weight:900;color:var(--pri);margin:14px 0 4px;border-bottom:2px solid var(--line);display:inline-block;padding:0 16px 4px}
.cert .seal{width:86px;height:86px;border-radius:50%;border:3px solid var(--bad);color:var(--bad);display:grid;place-items:center;font-weight:900;margin:16px auto 0;transform:rotate(-10deg);font-size:14px;line-height:1.2}
/* tables etc */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;border-top:0}
.qlist .item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.qlist .item:first-child{border-top:0}
.qlist .thumb{width:58px;height:44px;border-radius:8px;background:var(--bg);display:grid;place-items:center;flex:none;overflow:hidden;font-size:20px}
.qlist .thumb img{width:100%;height:100%;object-fit:cover}
.qlist .t{flex:1;min-width:0} .qlist .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--pri-soft);color:var(--pri);font-weight:700;margin-right:4px}
.tag.o{background:var(--acc-soft);color:#8a5a00}
.drop{border:2px dashed var(--line);border-radius:14px;padding:16px;text-align:center;background:var(--bg);display:block;cursor:pointer}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.codebox{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all;background:var(--bg);border-radius:10px;padding:10px;max-height:120px;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;overflow:auto;display:flex;align-items:center;justify-content:center}
.zoom img{max-width:100%;max-height:100%}
.zoom.x2 img{max-width:none;max-height:none;width:200%}
.zoom .close{position:fixed;top:12px;right:12px;background:#fff;border:0;border-radius:99px;width:42px;height:42px;font-size:20px;z-index:51}
.roles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.roles button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 8px;font-weight:700}
.roles button.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
/* mode switch */
.modesw{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:#E6E0D3;border-radius:16px;padding:4px;margin-bottom:14px}
.modesw button{border:0;background:none;border-radius:12px;padding:7px 2px;font-weight:900;color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:1px;white-space:nowrap}.modesw button i{font-style:normal;font-size:17px;line-height:1.1}
.modesw button.on{background:#fff;color:var(--pri);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.modesw button.on.night{background:#1E2550;color:#FFD66B}
/* shift */
.night{background:#1E2550;color:#E9ECFF;border-radius:22px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.night h2{margin:0 0 6px;color:#FFD66B}
.night p,.night li{color:#C9CEF2;font-size:14px;line-height:1.7}
.night .moon{position:absolute;right:16px;top:14px;font-size:40px}
.shud{position:sticky;top:57px;z-index:4;background:#1E2550;color:#fff;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.shud .clock{font-weight:900;font-size:22px;font-variant-numeric:tabular-nums;color:#FFD66B}
.shud .en{flex:1}
.shud .en small{font-size:11px;color:#C9CEF2}
.shud .en .b{height:8px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
.shud .en .b i{display:block;height:100%;border-radius:99px;transition:width .5s,background .5s}
.shud .sc{font-weight:900;color:#fff;white-space:nowrap}
.floor{position:relative;background:#2A3268;border-radius:20px;padding:10px;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto;gap:8px}
.zone{border-radius:14px;overflow:hidden;background:#fff;position:relative;border:0;padding:0;text-align:left;line-height:0}
.zone .scene{width:100%;height:auto;display:block}
.zone .zl{line-height:1.3;display:block;padding:5px 7px;font-size:12px;font-weight:900;color:var(--ink)}
.zone .alert{position:absolute;top:5px;right:5px;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;font-weight:900;padding:1px 7px;line-height:1.5;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.45}}
.zone.simple{display:flex;flex-direction:column;justify-content:space-between;line-height:1.3}
.zone.simple .art{flex:1;display:grid;place-items:center;font-size:30px;min-height:56px}
.avatar{position:absolute;width:38px;height:44px;margin:-30px 0 0 -19px;transition:left .9s ease-in-out,top .9s ease-in-out;z-index:3;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.avatar.walk img,.avatar.walk svg{animation:bob .25s infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
.evlist{margin-top:12px;display:grid;gap:8px}
.ev{display:flex;gap:10px;align-items:center;border:0;background:#fff;border-radius:14px;padding:10px 12px;text-align:left;border-left:5px solid var(--acc);width:100%}
.ev.hot{border-left-color:var(--bad)}
.ev .ei{font-size:24px}
.ev .et{flex:1;min-width:0}
.ev .et b{display:block;font-size:15px}
.ev .et small{color:var(--muted);font-size:12.5px}
.ev .dl{font-weight:900;font-size:13px;color:var(--acc);white-space:nowrap}
.ev.hot .dl{color:var(--bad)}
.quiet{color:#9AA3D6;text-align:center;font-size:14px;padding:14px}
.modal{position:fixed;inset:0;background:rgba(15,18,40,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--bg);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px 26px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.story{background:#fff;border-radius:14px;padding:12px 14px;border-left:5px solid var(--pri);line-height:1.7;margin-bottom:6px}
.rank{font-size:26px;font-weight:900;color:#FFD66B;margin:6px 0}
.chief{background:#fff;color:var(--ink);border-radius:14px;padding:12px 14px;margin-top:12px;text-align:left;line-height:1.7}

/* game feel */
.btn{box-shadow:0 3px 0 rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.room{box-shadow:0 4px 0 rgba(59,52,86,.18),0 8px 18px rgba(59,52,86,.10);border:2px solid #3B3456}
.plan{background:linear-gradient(180deg,#E9E2D2,#DED5C1);border:2px solid #3B3456;box-shadow:inset 0 2px 0 rgba(255,255,255,.6)}
.hero{border:2px solid #3B3456;box-shadow:0 4px 0 rgba(59,52,86,.25)}
.heroface{position:absolute;right:12px;top:12px;width:74px;height:74px;border-radius:50%;border:2px solid rgba(255,255,255,.7);overflow:hidden}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cpick{border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cpick .cp{width:58px;height:58px;display:block}
.cpick b{font-size:13px;color:var(--ink)} .cpick small{font-size:11px;color:var(--muted)}
.cpick.on{border-color:var(--pri);background:var(--pri-soft);box-shadow:0 3px 0 var(--pri)}
.pickwrap{margin:6px 0 14px}.pickwrap summary{color:#FFD66B;font-weight:700;cursor:pointer;margin-bottom:8px}
.ichar{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:16px;padding:10px;margin:10px 0}
.pf{width:58px;height:58px;border-radius:50%;overflow:hidden;flex:none;border:2.5px solid #FFD66B;box-shadow:0 3px 0 rgba(0,0,0,.3);display:block;background:#FFF4D6}
.pf.big{width:64px;height:64px}
.shud{background:linear-gradient(180deg,#2B3470,#1A2050);border:2px solid #0E1236;box-shadow:0 4px 0 #0E1236,inset 0 1px 0 rgba(255,255,255,.15);padding:10px}
.shud .hc{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.shud .r1{display:flex;align-items:center;gap:8px}
.shud .who2{font-size:12px;color:#C9CEF2;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shud .sc{background:#FFD66B;color:#3a2600;border-radius:99px;padding:2px 10px;font-size:14px;box-shadow:0 2px 0 #B8902C}
.shud .sx{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:4px 10px;font-weight:900}
.shud .en{display:flex;align-items:center;gap:8px}
.shud .en small{white-space:nowrap}
.shud .en .b{flex:1;height:10px;border:1.5px solid #0E1236}
.floor{grid-template-columns:repeat(3,1fr);border:2px solid #0E1236;background:linear-gradient(180deg,#2A3268,#1E2550);box-shadow:0 4px 0 #0E1236}
.zone{border:2px solid #0E1236}
.zone .zl{background:#fff;border-top:1.5px solid #0E1236;font-size:11.5px}
.avatar{width:40px;height:65px;margin:-52px 0 0 -20px}
.ev{box-shadow:0 3px 0 rgba(59,52,86,.15);border:2px solid #3B3456;border-left-width:6px}
.modal .sheet{border:2px solid #3B3456;border-bottom:0}

.cbuild{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:16px;padding:10px;margin-bottom:4px}
.cprev{flex:none;display:block}
.cfields{flex:1;min-width:0}
.swatches{display:flex;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1.5px #3B3456}
.sw.on{box-shadow:0 0 0 3px #3A4AA6}
.pickin{background:var(--bg);color:var(--ink);border-radius:16px;padding:12px}
.pickin .f{color:var(--ink)}

    const autoId=()=>{const c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';let s='';const a=crypto.getRandomValues(new Uint8Array(20));a.forEach(x=>s+=c[x%62]);return s};

    window.__fbGetImg=getImg;

function myStats(){

  lv.forEach(l=>{const n=Math.min(l.qs.length,QN);const b=bestOf(l.id);maxStars+=n;if(b){stars+=Math.min(b.score,n);if(b.stamp)stamps++;if(b.stamp==='gold')gold++}});
  return {stamps,gold,stars,maxStars,total:lv.length};
}
function testSet(){
  let marked=questions.filter(q=>q.inTest&&q.type!=='sort');
  if(!marked.length) marked=Object.keys(ROOMS).flatMap(r=>levelsOf(r).flatMap(l=>l.qs).filter(q=>q.type!=='sort').slice(0,5));
  return marked.sort((a,b)=>Object.keys(ROOMS).indexOf(a.room)-Object.keys(ROOMS).indexOf(b.room)||(+a.lvOrder||0)-(+b.lvOrder||0)||(+a.order||0)-(+b.order||0)).slice(0,20);
}

const SEXES=[{id:'f',label:'女醫檢師'},{id:'m',label:'男醫檢師'}];
let myChar=LS.get('dl_char3',{sex:'f',name:''});
const curChar=()=>({...myChar,name:(myChar.name||player?.name||'我').slice(0,10)});
const saveChar=()=>LS.set('dl_char3',myChar);
const EXMAP={normal:'full',happy:'happy',panic:'panic',busy:'busy',sleepy:'sleepy',soul:'soul',nervous:'panic',sad:'soul'};
const EXBG={normal:'#FFF4D6',happy:'#FFF0C2',panic:'#DDEBFF',busy:'#F0E4FF',sleepy:'#E3E6F7',soul:'#E6E3EF'};
function charPortrait(c,expr='normal',bg){const e=EXMAP[expr]||'full';return `<img src="${IMG[c.sex].p[e]}" alt="" style="width:100%;height:100%;object-fit:cover;display:block;background:${bg||EXBG[expr]||'#FFF4D6'}">`}
function charBody(c,expr='normal'){const e=EXMAP[expr]||'full';const src=IMG[c.sex].b[e]||IMG[c.sex].b.full;return `<img src="${src}" alt="" style="height:64px;width:auto;display:block;margin:0 auto;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))">`}
function charPicker(){
  return `<div class="cgrid2">${SEXES.map(s=>`<button class="cpick2 ${myChar.sex===s.id?'on':''}" data-sex="${s.id}"><img src="${IMG[s.id].b.full}" alt=""><b>${s.label}</b></button>`).join('')}</div>
   <label class="f">角色名字</label><input type="text" id="cname" maxlength="10" placeholder="${esc(player?.name||'自己取一個名字')}" value="${esc(myChar.name)}">`;
}
function bindPicker(app,rerender,before){
  const nm=app.querySelector('#cname'); if(nm) nm.oninput=()=>{myChar.name=nm.value.trim();saveChar()};
  app.querySelectorAll('[data-sex]').forEach(b=>b.onclick=()=>{before&&before();myChar.sex=b.dataset.sex;saveChar();rerender()});
}

/* ===== 大廳地圖 ===== */
function renderHall(app){
  const st=myStats();
  let h='';
  if(dbState==='none') h+=`<div class="note">⚠️ 目前讀不到題庫。請確認已登入 Claude 帳號後重新開啟連結。</div>`;
  if(dbState==='slow') h+=`<div class="note">⏳ 題庫載入中，網路可能較慢…</div>`;
  if(local.pending.length||(local.pendingS||[]).length) h+=`<div class="note">📮 有 ${local.pending.length+(local.pendingS||[]).length} 筆紀錄還沒傳給老師。<button class="btn sm acc" data-go="sync" style="margin-left:6px">產生進度碼</button></div>`;
  h+=`<div class="whero hallh"><span class="bub" style="width:120px;height:120px;left:-30px;bottom:-50px"></span><span class="bub" style="width:60px;height:60px;left:48%;top:-24px"></span><span class="sparkle" style="right:34%;top:14px">✦</span>
    <span class="tag2">${esc(player.role)}｜<button class="linkb" data-go="join">換人</button></span><h2>${esc(player.name)}</h2><p>今天也來練練看細節吧！</p>
    <span class="duo"><img src="${IMG[curChar().sex].b.happy||IMG[curChar().sex].b.full}" alt=""></span>
    <div class="stats"><div><b>⭐ ${st.stars}</b><small>/ ${st.maxStars} 星</small></div><div><b>🏅 ${st.stamps}</b><small>/ ${st.total} 枚章</small></div><div><b>🥇 ${st.gold}</b><small>金章</small></div></div></div>`;
  h+=`<div class="modesw"><button class="${mode==='learn'?'on':''}" data-mode="learn"><i>📚</i>學習模式</button><button class="${mode==='shift'?'on night':''}" data-mode="shift"><i>🌙</i>值班模式</button><button class="${mode==='flow'?'on':''}" data-mode="flow"><i>🔁</i>流程模式</button><button class="${mode==='taf'?'on':''}" data-mode="taf"><i>📋</i>TAF來了</button></div>`;
  if(mode==='flow'||mode==='taf'){ h=`<div class="hallwrap"><div class="hcol">${h}</div><div class="rcol">${renderSoon(mode)}</div>${svBar()}</div>`; app.innerHTML=h; bindSv();
    app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;LS.set('dl_mode',mode);render()}); return; }
  if(mode==='shift'){ h=`<div class="hallwrap"><div class="hcol">${h}</div><div class="rcol">${renderShiftIntro()}</div>${svBar()}</div>`; app.innerHTML=h; bindSv();
    app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;LS.set('dl_mode',mode);render()});
    $('#startShift').onclick=startShift;
    app.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{shiftDiff=b.dataset.diff;LS.set('dl_diff_'+(player?.id||''),shiftDiff);app.querySelectorAll('[data-diff]').forEach(x=>x.classList.toggle('on',x===b))}); return; }

/* ===== 遊戲 ===== */
function makeItem(q){
  const it={q,state:null,ok:null};
  if(q.type==='choice'){
    let opts=(q.options||[]).map(s=>String(s).trim()).filter(Boolean);
    if(!opts.includes(q.answer)) opts.unshift(q.answer);
    if(opts.length<4&&(q.room==='micro'||q.room==='blood')){for(const s of shuffle(q.room==='micro'?MBANK:BANK)){if(opts.length>=4)break;if(!opts.includes(s))opts.push(s)}}
    it.opts=shuffle([...new Set(opts)]); it.gone=[];
  }
  if(q.type==='sort'){it.pool=shuffle(q.items.map((s,i)=>({s,i})));it.seq=[]}
  if(q.type==='spot'){it.tap=null}
  return it;
}
const QN=10;
function startLevel(l){
  if(!l.qs.length) return;
  const pick=l.qs.length>QN?shuffle(l.qs).slice(0,QN):l.qs;
  play={kind:'level',levelId:l.id,room:l.room,label:l.name,items:pick.map(makeItem),i:0,hints:3,hintsUsed:0,start:Date.now(),fb:false};
  go('play');
}
function startTest(label){
  const qs=testSet(); if(!qs.length) return toast('還沒有題目');
  play={kind:'test',levelId:'test::'+label,room:'',label,items:qs.map(makeItem),i:0,hints:0,hintsUsed:0,start:Date.now(),fb:false};
  go('play');
}
function startRandom(room){const qs=shuffle(questions.filter(q=>q.room===room)).slice(0,QN);if(!qs.length)return toast('這個房間還沒有題目');
  play={kind:'random',levelId:'random::'+room,room,label:`隨機 ${qs.length} 題`,items:qs.map(makeItem),i:0,hints:3,hintsUsed:0,start:Date.now(),fb:false};go('play')}
function startFinal(){
  const qs=shuffle(questions).slice(0,10);
  play={kind:'final',levelId:'final',room:'',label:'總複習大挑戰',items:qs.map(makeItem),i:0,hints:3,hintsUsed:0,start:Date.now(),fb:false};
  go('play');
}
function renderPlay(app){
  const it=play.items[play.i], q=it.q, total=play.items.length, answered=it.state!==null, test=play.kind==='test';
  const correctSoFar=play.items.filter(x=>x.ok).length;
  let h=`<div class="qtop"><button class="btn ghost sm" id="quit">✕</button><div class="prog"><i style="width:${(play.i+(answered?1:0))/total*100}%"></i></div>
    <span class="muted">${play.i+1}/${total}</span>${test?'':`<span class="stars">⭐${correctSoFar}</span>`}</div>
    <div class="muted" style="margin-bottom:6px">${play.room?ROOMS[play.room].ic+' '+ROOMS[play.room].name+'・':''}${esc(play.label)}${test?'｜作答中不顯示對錯':''}</div>`;
  // body by type（左：圖與題目；右：選項與解說）
  let L='',R='';
  if(q.type==='spot'){
    L+=`<div class="prompt">${nl(q.prompt||'請點出圖中有問題的地方')}</div>
      <div class="spotwrap" id="spot"><img src="${q.img}" alt="找錯圖片">${it.tap?`<span class="mark" style="left:${it.tap.x*100}%;top:${it.tap.y*100}%"></span>`:''}${answered&&!test?`<span class="mark ans" style="left:${q.spot.x*100}%;top:${q.spot.y*100}%;width:${q.spot.r*200}%;height:auto;aspect-ratio:1;margin:0;transform:translate(-50%,-50%)"></span>`:''}</div>
`;
    R+=`${!answered?`<p class="muted">點圖片標出位置，再按「確定」。</p><button class="btn full" id="spotok" ${it.tap?'':'disabled'}>確定</button>`:''}`;
  } else {
    if(q.img) L+=`<div class="imgbox" id="img"><img src="${q.img}" alt="題目圖片"><span class="hint">點圖放大</span></div>`;
    L+=`<div class="prompt">${nl(q.prompt||'這是什麼？')}</div>`;
    if(q.type==='choice'){
      R+=`<div class="opts">${it.opts.map((o,k)=>{let c='';
        if(answered&&!test){if(o===q.answer)c='ok';else if(o===it.state)c='bad'}
        if(!answered&&it.gone.includes(o))c='gone';
        return `<button class="opt ${c}" data-o="${k}" ${answered||it.gone.includes(o)?'disabled':''}>${esc(o)}</button>`}).join('')}</div>`;
    }
    if(q.type==='sort'){
      R+=`<div class="seq">${it.seq.length?it.seq.map((x,k)=>`<div class="it">${k+1}. ${esc(x.s)}${answered&&!test?(x.i===k?' ✅':' ❌'):''}</div>`).join(''):'<div class="ph">依序點下面的項目，排出正確順序</div>'}</div>`;
      if(!answered){
        R+=`<div class="opts">${it.pool.filter(x=>!it.seq.includes(x)).map(x=>`<button class="opt" data-p="${x.i}">${esc(x.s)}</button>`).join('')}</div>
        <div class="toolrow"><button class="btn ghost" id="sreset" style="flex:1">重排</button><button class="btn" id="sok" style="flex:2" ${it.seq.length===q.items.length?'':'disabled'}>確定</button></div>`;
      }
    }
  }
  if(!answered && !test && play.hints>0) R+=`<div class="toolrow"><button class="btn acc sm" id="hint">💡 提示（剩 ${play.hints}）</button></div>`;
  if(it.hintText && !answered) R+=`<div class="fb tip pop"><b>💡 提示</b>${nl(it.hintText)}</div>`;
  if(answered && !test){
    let ans=''; if(q.type==='sort'&&!it.ok) ans=`<div>正確順序：${q.items.map((s,i)=>`${i+1}. ${esc(s)}`).join('　')}</div>`;
    if(q.type==='choice'&&!it.ok) ans=`<div>正解：${esc(q.answer)}</div>`;
    if(q.type==='spot'&&!it.ok) ans=`<div>綠色虛線圈是正確位置。</div>`;
    R+=`<div class="fb ${it.ok?'ok':'bad'} pop"><b>${it.ok?'✅ 答對了！':'❌ 再看看細節'}</b>${ans}${q.explain?`<div style="margin-top:6px">${nl(q.explain)}</div>`:''}</div>
      <div style="height:10px"></div><button class="btn full" id="next">${play.i<total-1?'下一題 →':'看結果'}</button>`;
  }
  h+=`<div class="pgrid ${(q.img||q.type==='spot')?'hasimg':'noimg'} ${answered?'answered':''}"><div class="pl">${L}</div><div class="pr">${R}</div></div>`;
  app.innerHTML=h;
  // events
  const quit=$('#quit'); quit.onclick=()=>{if(quit.dataset.s){go(play.room?'room':'hall')}else{quit.dataset.s=1;quit.textContent='確定離開？';setTimeout(()=>{if(quit.isConnected){quit.textContent='✕';delete quit.dataset.s}},2500)}};
  if($('#img')) $('#img').onclick=()=>openZoom(q.img);
  app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>answer(it.opts[+b.dataset.o]));
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{it.seq.push(it.pool.find(x=>x.i===+b.dataset.p));renderPlay(app)});
  if($('#sreset')) $('#sreset').onclick=()=>{it.seq=[];renderPlay(app)};
  if($('#sok')) $('#sok').onclick=()=>answer(it.seq.map(x=>x.i));
  if($('#spot')&&!answered) $('#spot').onclick=e=>{const r=$('#spot img').getBoundingClientRect();it.tap={x:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y:Math.min(1,Math.max(0,(e.clientY-r.top)/r.height)),w:r.width,h:r.height};renderPlay(app)};
  if($('#spotok')) $('#spotok').onclick=()=>answer(it.tap);
  if($('#hint')) $('#hint').onclick=()=>useHint(it);
  if($('#next')) $('#next').onclick=next;
  if(answered){const fb=app.querySelector('.fb');if(fb)setTimeout(()=>fb.scrollIntoView({behavior:'smooth',block:'nearest'}),30)}
}
function useHint(it){
  if(play.hints<=0||it.hintText) return;
  const q=it.q; let t=q.hint||'';
  if(!t && q.type==='choice'){const wrong=it.opts.filter(o=>o!==q.answer&&!it.gone.includes(o));if(wrong.length>1){it.gone.push(shuffle(wrong)[0]);t='已幫你刪去一個錯誤選項。'}}
  if(!t && q.type==='spot'){t=`問題在畫面的${q.spot.y<.5?'上':'下'}半部、${q.spot.x<.5?'左':'右'}側。`}
  if(!t && q.type==='sort'){t=`第一個是「${q.items[0]}」。`}
  if(!t) return toast('這題沒有提示');
  it.hintText=t; play.hints--; play.hintsUsed++; renderPlay($('#app'));
}
function answer(v){
  const it=play.items[play.i], q=it.q; if(it.state!==null) return;
  if(q.type==='choice'){it.state=v;it.ok=v===q.answer}
  if(q.type==='sort'){it.state=v;it.ok=v.every((x,k)=>x===k)}
  if(q.type==='spot'){it.state=v;const dx=(v.x-q.spot.x)*v.w,dy=(v.y-q.spot.y)*v.h;it.ok=Math.hypot(dx,dy)<=q.spot.r*v.w}
  if(play.kind==='test') return next();
  renderPlay($('#app'));
}
function next(){ if(play.i<play.items.length-1){play.i++;renderPlay($('#app'));window.scrollTo(0,0)} else finish(); }
async function finish(){
  const score=play.items.filter(x=>x.ok).length,total=play.items.length,pct=Math.round(score/total*100);
  const prev=play.kind==='level'?bestOf(play.levelId):null;
  let stamp='';
  if(play.kind==='level'){ if(score/total>=PASS) stamp=(score===total&&play.hintsUsed===0)?'gold':'silver'; }
  const rec={rid:uid(),pid:player.id,name:player.name,role:player.role,kind:play.kind,label:play.label,levelId:play.levelId,room:play.room,
    score,total,pct,stamp,hints:play.hintsUsed,dur:Math.round((Date.now()-play.start)/1000),ts:Date.now(),items:play.items.map(x=>({q:x.q.id,ok:!!x.ok}))};
  local.results.push(rec); if(local.results.length>300) local.results=local.results.slice(-300); LS.set('dl_local',local);
  const newStamp = stamp && (!prev || (stamp==='gold'&&prev.stamp!=='gold') || !prev.stamp);
  lastDone={rec,items:play.items,newStamp,saved:'saving'};
  go('done');
  try{ if(!db) throw 0; await db.collection('results').doc(rec.rid).set(rec); lastDone.saved='ok'; }
  catch(e){ lastDone.saved='fail'; local.pending.push(rec); LS.set('dl_local',local); }
  if(view==='done') render();
}
function renderDone(app){
  const {rec,items,newStamp,saved}=lastDone; const wrong=items.filter(x=>!x.ok);
  const back=rec.room?'room':'hall';
  let h=`<div class="card done">`;
  if(rec.kind==='level'){
    h+=`<div class="stamp bigstamp ${rec.stamp} ${newStamp?'thump':''}">${rec.stamp==='gold'?'金章':rec.stamp?'過關':'未過關'}</div>
      <div style="font-weight:900;font-size:19px">${rec.stamp==='gold'?'完美！拿到金章 🥇':rec.stamp?'過關！拿到印章 🏅':`再試一次！答對 ${Math.ceil(rec.total*PASS)} 題就能過關`}</div>`;
  } else h+=`<div class="muted">${esc(rec.label)}</div>`;
  h+=`<div class="big" style="margin-top:10px">${rec.score}<span style="font-size:22px;color:var(--muted)"> / ${rec.total}</span></div>

  if(saved==='ok') h+=`<div class="note" style="background:var(--ok-soft)">✅ 紀錄已同步給老師</div>`;
  if(saved==='fail') h+=`<div class="note">📮 這次紀錄沒辦法自動傳給老師，已先存在這台裝置。<button class="btn sm acc" data-go="sync" style="margin-left:6px">產生進度碼</button></div>`;
  if(wrong.length && rec.kind!=='test'){
    h+=`<div class="card"><h3>錯題回顧</h3>${wrong.map(x=>{const q=x.q;let a=q.type==='choice'?q.answer:q.type==='sort'?q.items.join(' → '):'見圖中標示';
      return `<div class="wl">${q.img?`<img src="${q.img}" alt="">`:''}<div><b>${esc(q.prompt||'這是什麼？')}</b><div style="color:var(--ok);font-weight:700">正解：${esc(a)}</div>${q.explain?`<div class="muted">${nl(q.explain)}</div>`:''}</div></div>`}).join('')}</div>`;
  }
  if(rec.kind!=='test') h+=`<details class="card"><summary style="font-weight:900;cursor:pointer">📖 看全部 ${items.length} 題的解答</summary>${items.map((x,i)=>{const q=x.q;const a=q.type==='choice'?q.answer:q.type==='sort'?q.items.join(' → '):'見圖中標示位置';
    return `<div class="wl">${q.img?`<img src="${q.img}" alt="">`:''}<div><b>${i+1}. ${esc(q.prompt||'這是什麼？')}</b> ${x.ok?'✅':'❌'}<div style="color:var(--ok);font-weight:700">正解：${esc(a)}</div>${q.explain?`<div class="muted">${nl(q.explain)}</div>`:''}</div></div>`}).join('')}</details>`;
  h+=`<div class="row">${rec.kind==='level'||rec.kind==='random'?`<button class="btn ghost" id="again" style="flex:1">${rec.kind==='random'?'再抽 10 題':'再挑戰'}</button>`:''}<button class="btn" data-go="${back}" style="flex:1">${rec.room?'回房間':'回地圖'}</button></div>`;
  app.innerHTML=h;
  if($('#again')) $('#again').onclick=()=>{if(rec.kind==='random')return startRandom(rec.room);const l=levelsOf(rec.room).find(x=>x.id===rec.levelId);if(l)startLevel(l)};

/* ===== 批次匯入 ===== */
let impRows=null, impRoom='collect', impLevel='';
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=rej;document.head.appendChild(s)})}
function parseCSV(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}if(c||r.length){r.push(c);rows.push(r)}return rows}
function parseTable(text){text=text.replace(/\r\n?/g,'\n').trim();if(!text)return[];return text.includes('\t')?text.split('\n').map(l=>l.split('\t')):parseCSV(text)}
const ROOM_ALIAS={'採檢室':'collect','生理檢查室':'collect','採檢':'collect','生理':'collect','採檢與生理檢查室':'collect','血液組':'blood','血液':'blood','鏡檢':'micro'};
const ROOM_BY_NAME=n=>{n=String(n||'').trim();if(!n)return null;if(ROOM_ALIAS[n])return ROOM_ALIAS[n];return Object.keys(ROOMS).find(k=>ROOMS[k].name===n||ROOMS[k].name.replace('組','').replace('室','')===n.replace('組','').replace('室',''))||null};
function rowsToQs(rows){
  const out=[],errs=[];
  rows.forEach((r,i)=>{r=r.map(x=>String(x??'').trim());if(!r.some(Boolean))return;if(i===0&&/題目/.test(r.join('')))return;
    const [prompt,answer,d1,d2,d3,explain,level,room,hint]=r;
    if(!prompt||!answer){errs.push(`第 ${i+1} 行：缺少題目或正確答案`);return}
    const dis=[d1,d2,d3].filter(x=>x&&x!==answer); if(!dis.length){errs.push(`第 ${i+1} 行：至少要有一個錯誤選項`);return}
    const rm=ROOM_BY_NAME(room)||impRoom;
    out.push({room:rm,level:(level||impLevel||'隨機題庫').trim(),type:'choice',prompt,answer,options:[answer,...dis],explain:explain||'',hint:hint||''});});
  return {qs:out,errs};
}
function importCard(){
  return `<details class="card" id="impd" ${impRows?'open':''}><summary style="font-weight:900;cursor:pointer">📥 批次匯入題目（Excel／CSV）</summary>
  <p class="muted">在 Excel 依下列欄位排好（第一列可以是標題），整段複製貼上，或直接上傳 .xlsx／.csv 檔。</p>
  <div style="overflow-x:auto"><table class="tpl"><tr><th>A 題目</th><th>B 正確答案</th><th>C 錯誤選項1</th><th>D 錯誤選項2</th><th>E 錯誤選項3</th><th>F 解說</th><th>G 關卡（可空）</th><th>H 科室（可空）</th></tr>
  <tr><td>紫頭 EDTA 管最常用於？</td><td>CBC</td><td>PT/aPTT</td><td>血糖</td><td>生化</td><td>藍頭→凝血…</td><td>採血基本功</td><td>採檢室</td></tr></table></div>
  <button class="btn ghost sm" id="tplcp" style="margin-top:8px">📋 複製範本（貼到 Excel）</button>
  <label class="f">沒填科室的題目匯入到</label><div class="chips">${Object.entries(ROOMS).map(([k,r])=>`<button class="chip ${impRoom===k?'on':''}" data-iroom="${k}">${r.ic} ${r.name}</button>`).join('')}</div>
  <label class="f">沒填關卡的題目放進關卡</label><input type="text" id="implv" placeholder="隨機題庫" value="${esc(impLevel)}">
  <label class="f">貼上題目</label><textarea id="imptx" style="min-height:120px" placeholder="從 Excel 複製後貼在這裡"></textarea>
  <div class="row" style="margin-top:8px"><label class="btn ghost sm" for="impf">📂 或選擇 .xlsx／.csv 檔</label><input type="file" id="impf" accept=".xlsx,.xls,.csv,.txt" hidden><button class="btn sm" id="impchk">檢查題目</button></div>
  <div id="impprev">${impRows?impPreview():''}</div></details>`;

function impPreview(){const {qs,errs}=impRows;const by={};qs.forEach(q=>{const k=ROOMS[q.room].name+'｜'+q.level;by[k]=(by[k]||0)+1});
  return `<div class="note" style="margin-top:12px;background:${qs.length?'var(--ok-soft)':'var(--bad-soft)'}"><b>可以匯入 ${qs.length} 題</b>${Object.entries(by).map(([k,n])=>`<br>・${esc(k)}：${n} 題`).join('')}${errs.length?`<br><br><b style="color:var(--bad)">有 ${errs.length} 行無法匯入：</b><br>${errs.slice(0,8).map(esc).join('<br>')}${errs.length>8?'<br>…':''}`:''}</div>
  ${qs.slice(0,3).map(q=>`<div class="wl"><div><b>${esc(q.prompt)}</b><div style="color:var(--ok)">✔ ${esc(q.answer)}</div><div class="muted">✘ ${q.options.slice(1).map(esc).join('、')}</div></div></div>`).join('')}
  ${qs.length?`<button class="btn full" id="impgo" style="margin-top:10px">匯入 ${qs.length} 題</button>`:''}`}
function bindImport(app){
  const d=$('#impd');if(!d)return;
  $('#tplcp').onclick=()=>copyText(['題目','正確答案','錯誤選項1','錯誤選項2','錯誤選項3','解說','關卡','科室'].join('\t')+'\n'+['紫頭 EDTA 管最常用於哪一項檢驗？','全血球計數（CBC）','凝血功能（PT、aPTT）','血糖','血清生化','藍頭→凝血；灰頭→血糖；紅頭、黃頭→生化','採血基本功','採檢室'].join('\t'));
  app.querySelectorAll('[data-iroom]').forEach(b=>b.onclick=()=>{impRoom=b.dataset.iroom;app.querySelectorAll('[data-iroom]').forEach(x=>x.classList.toggle('on',x===b));if(impRows)check()});
  $('#implv').oninput=e=>{impLevel=e.target.value};
  let lastRows=null;
  const check=()=>{if(!lastRows)lastRows=parseTable($('#imptx').value);impRows=rowsToQs(lastRows);$('#impprev').innerHTML=impPreview();const g=$('#impgo');if(g)g.onclick=doImport};
  $('#impchk').onclick=()=>{lastRows=parseTable($('#imptx').value);if(!lastRows.length)return toast('請先貼上題目或選擇檔案');check()};
  $('#imptx').oninput=()=>{lastRows=null};
  $('#impf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{
      if(/\.(xlsx|xls)$/i.test(f.name)){toast('讀取 Excel 中…');const X=await loadXLSX();const wb=X.read(await f.arrayBuffer());lastRows=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}
      else lastRows=parseTable(await f.text());
      $('#imptx').value=`（已讀取檔案：${f.name}，共 ${lastRows.length} 列）`;check()}catch(err){toast('讀不到這個檔案，請改用複製貼上')}};
  const g=$('#impgo');if(g)g.onclick=doImport;
}
async function doImport(){
  const {qs}=impRows;const b=$('#impgo');b.disabled=true;let n=0,fail=0;const t0=Date.now();
  for(const q of qs){b.textContent=`匯入中… ${n+fail+1}/${qs.length}`;
    const data={...q,lvOrder:+(levelsOf(q.room).find(l=>l.name===q.level)?.ord||levelsOf(q.room).length+1)||1,order:n+1,created:t0+n};
    let ok=false;for(let k=0;k<3&&!ok;k++){try{await db.collection('questions').doc('q'+uid()).set(data);ok=true}catch(e){await new Promise(r=>setTimeout(r,1200*(k+1)))}}
    ok?n++:fail++; await new Promise(r=>setTimeout(r,120));}
  impRows=null;toast(`✅ 匯入 ${n} 題${fail?`，${fail} 題失敗`:''}`);renderBank($('#app'));
}

function prepost(pairs){
  const W=340,rowH=34,H=pairs.length*rowH+30,L=92,R=W-16;const x=v=>L+(R-L)*v/100;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="前後測比較">`;
  [0,50,100].forEach(v=>s+=`<line x1="${x(v)}" x2="${x(v)}" y1="4" y2="${H-22}" stroke="#E6E0D3"/><text x="${x(v)}" y="${H-8}" font-size="10" text-anchor="middle" fill="#6C6878">${v}%</text>`);
  pairs.forEach((p,i)=>{const y=14+i*rowH;
    s+=`<text x="${L-8}" y="${y+5}" font-size="12" text-anchor="end" fill="#22212B">${esc(p.name.slice(0,6))}</text>`;
    if(p.pre!=null&&p.post!=null) s+=`<line x1="${x(p.pre)}" x2="${x(p.post)}" y1="${y}" y2="${y}" stroke="#C9C1AE" stroke-width="3"/>`;
    if(p.pre!=null) s+=`<circle cx="${x(p.pre)}" cy="${y}" r="6" fill="#fff" stroke="#9AA3B2" stroke-width="2.5"><title>前測 ${p.pre}%</title></circle>`;
    if(p.post!=null) s+=`<circle cx="${x(p.post)}" cy="${y}" r="6" fill="#3A4AA6"><title>後測 ${p.post}%</title></circle>`;
  });
  return s+`</svg><div class="legend"><span><i style="background:#fff;border:2px solid #9AA3B2"></i>前測</span><span><i style="background:#3A4AA6"></i>後測</span></div>`;
}

    for(let k=0;k<8;k++){const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<180000)return out;if(q>.55)q-=.1;else max=Math.round(max*.85)}
    return out.length<230000?out:null}finally{URL.revokeObjectURL(url)}
}
function blankDraft(){return {room:bankRoom,level:'',lvOrder:'',type:'choice',prompt:'',img:'',answer:'',distractors:'',items:'',spot:null,r:8,hint:'',explain:'',inTest:false,order:''}}

      <div style="flex:1;min-width:90px"><label class="f">關卡順序</label><input type="number" id="f_lvo" placeholder="1" value="${esc(d.lvOrder)}"></div></div>

  // list
  const lv=levelsOf(bankRoom);
  h+=`<div class="row" style="margin:6px 0 10px"><h3 style="margin:0">題庫</h3><span class="muted">共 ${questions.length} 題</span></div>

  h+=lv.length?lv.map(l=>`<div class="card qlist"><div class="lvhead" data-lvh="${esc(l.name)}"><h3>${esc(l.name)} <span class="muted">（${l.qs.length} 題${l.qs.length>QN?`，每次隨機出 ${QN} 題`:''}）</span></h3><button class="btn ghost sm" data-rnlv="${esc(l.name)}">✏️ 改名／合併</button></div>${l.qs.map(q=>`<div class="item"><div class="thumb">${q.img?`<img src="${q.img}" alt="">`:q.type==='sort'?'🔢':'📝'}</div><div class="t"><b>${esc(q.prompt||q.answer)}</b><span class="tag">${TYPE_N[q.type]}</span></div><button class="btn ghost sm" data-ed="${q.id}">編輯</button><button class="btn warn sm" data-rm="${q.id}">刪</button></div>`).join('')}</div>`).join(''):`<div class="card"><p class="muted" style="margin:0">這個房間還沒有題目。</p></div>`;
  const keepS=bankScroll(app); app.innerHTML=bankLayout(h,formH,'新增題目'); bankRestore(app,keepS,bankJump); bankJump=false;
  $('#bk_new').onclick=()=>{bankSync&&bankSync();editing=null;const k=draft?{room:draft.room,level:draft.level,lvOrder:draft.lvOrder,type:draft.type}:{};draft={...blankDraft(),...k};bankFormOpen=true;bankJump=true;renderBank(app)};
  $('#bk_back').onclick=()=>{editing=null;draft=null;bankFormOpen=false;renderBank(app)};
  // bind
  const sync=()=>{const g=id=>$(id);if(g('#f_level'))d.level=g('#f_level').value;if(g('#f_lvo'))d.lvOrder=g('#f_lvo').value;if(g('#f_prompt'))d.prompt=g('#f_prompt').value;if(g('#f_ans'))d.answer=g('#f_ans').value;if(g('#f_dis'))d.distractors=g('#f_dis').value;if(g('#f_items'))d.items=g('#f_items').value;if(g('#f_hint'))d.hint=g('#f_hint').value;if(g('#f_exp'))d.explain=g('#f_exp').value;if(g('#f_test'))d.inTest=g('#f_test').checked;if(g('#f_ord'))d.order=g('#f_ord').value};
  bankSync=sync; bindImport(app); bindBankSwitch(app); bindBackup(app);
  app.querySelectorAll('[data-froom]').forEach(b=>b.onclick=()=>{sync();d.room=b.dataset.froom;renderBank(app)});
  app.querySelectorAll('[data-ftype]').forEach(b=>b.onclick=()=>{sync();d.type=b.dataset.ftype;renderBank(app)});
  app.querySelectorAll('[data-lroom]').forEach(b=>b.onclick=()=>{sync();bankRoom=b.dataset.lroom;renderBank(app)});
  const useImg=async f=>{if(!f)return;sync();toast('照片處理中…');try{const u=await compress(f);if(!u)return toast('照片太大，請換一張');d.img=u;d.spot=null;renderBank(app);toast('照片已載入')}catch(err){toast('無法讀取這張照片')}};
  window._bankPasteImg=$('#form')?useImg:null;
  if($('#f_file')) $('#f_file').onchange=e=>useImg(e.target.files[0]);
  if($('#f_drop')){const z=$('#f_drop');z.ondragover=e=>{e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');z.ondrop=e=>{e.preventDefault();z.classList.remove('over');const f=[...(e.dataTransfer?.files||[])].find(x=>x.type.startsWith('image/'));f?useImg(f):toast('請拖曳圖片檔')}}
  if($('#f_paste')) $('#f_paste').onclick=async()=>{try{const items=await navigator.clipboard.read();for(const it of items){const t=it.types.find(x=>x.startsWith('image/'));if(t){const b=await it.getType(t);return useImg(new File([b],'paste.'+t.split('/')[1],{type:t}))}}toast('剪貼簿裡沒有圖片，請先複製一張圖片')}catch(e){toast('瀏覽器不允許讀取剪貼簿，請改按 Ctrl+V 貼上')}};

  if($('#f_spot')) $('#f_spot').onclick=e=>{sync();const r=$('#f_spot img').getBoundingClientRect();d.spot={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};renderBank(app)};
  if($('#f_r')) $('#f_r').oninput=e=>{d.r=+e.target.value;$('#rv').textContent=d.r;const m=$('#f_spot .mark');if(m)m.style.width=(d.r*2)+'%'};

  $('#f_save').onclick=async()=>{sync();
    const data={room:d.room,level:d.level.trim()||'第一關',lvOrder:d.lvOrder===''?1:+d.lvOrder,type:d.type,prompt:d.prompt.trim(),hint:d.hint.trim(),explain:d.explain.trim(),inTest:!!d.inTest,order:d.order===''?(questions.filter(q=>q.room===d.room&&q.level===d.level.trim()).length+1):+d.order,created:editing?(questions.find(q=>q.id===editing)?.created||Date.now()):Date.now()};

    }catch(e){b.disabled=false;b.textContent='再試一次';toast(e?.code==='quota_exceeded'?'空間已滿，請刪除一些題目':'儲存失敗，請再試一次')}};
  app.querySelectorAll('[data-rnlv]').forEach(b=>b.onclick=()=>{const old=b.dataset.rnlv,box=b.closest('.lvhead'),others=levelsOf(bankRoom).map(x=>x.name).filter(n=>n!==old);
    box.innerHTML=`<div style="flex:1;min-width:0"><label class="f" style="margin-top:0">類別新名稱</label><input type="text" id="rn_in" value="${esc(old)}" list="rn_dl"><datalist id="rn_dl">${others.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
      <p class="muted" style="margin:6px 0 0;font-size:13px">${others.length?`想合併就輸入另一個類別的名稱（例如「${esc(others[0])}」），這類的題目會全部併過去。`:'改完按儲存。'}</p>
      <div class="row" style="margin-top:8px"><button class="btn sm" id="rn_ok">儲存</button><button class="btn ghost sm" id="rn_no">取消</button></div></div>`;
    const inp=$('#rn_in');inp.focus();inp.select();
    $('#rn_no').onclick=()=>renderBank(app);

      const ord=tgt?tgt.ord:src.ord;const ok=$('#rn_ok');ok.disabled=true;ok.textContent='更新中…';
      try{await Promise.all(src.qs.map(q=>{const r=db.doc('questions/'+q.id),d={level:nn,lvOrder:ord,room:bankRoom};return r.update?r.update(d):r.set(d,{merge:true})}));
        src.qs.forEach(q=>{q.level=nn;q.lvOrder=ord;q.room=bankRoom});toast(tgt?`已合併到「${nn}」，共 ${src.qs.length+tgt.qs.length} 題 ✅`:`已改名為「${nn}」✅`);renderBank(app)}

/* ===== Firebase 版：管理員改用 Email 登入（覆蓋原本的密碼登入） ===== */
function adminCard(){
  if(isTeacher) return `<div class="card adm"><b>🔓 管理員模式已開啟</b><div class="muted" style="font-size:13px">${esc(window.__fbAdmin?.email()||'')}</div><div class="row" style="margin-top:8px"><button class="btn sm" data-go="scores">成績</button><button class="btn sm" data-go="bank">題庫</button><button class="btn sm" data-go="svedit">問卷設定</button><button class="btn warn sm" id="alogout">登出管理</button></div></div>`;
  return `<details class="card adm" ${adminPanel?'open':''} id="admd"><summary>🔒 管理員登入</summary><div style="margin-top:10px">
   <input type="text" id="aem" placeholder="管理員 Email" autocomplete="username" inputmode="email"><div style="height:8px"></div>
   <input type="password" id="apw" placeholder="密碼" autocomplete="current-password"><div style="height:10px"></div>
   <button class="btn full" id="apgo">登入管理</button><p class="muted" style="margin-bottom:0"><button class="linkb" id="aforgot" style="color:var(--muted)">忘記密碼？寄重設信</button></p></div></details>`;
}
function bindAdmin(app){
  const lo=$('#alogout'); if(lo) lo.onclick=async()=>{try{await window.__fbAdmin.signOut()}catch(e){}isTeacher=false;canAdmin=false;subResults();toast('已登出管理員');render()};
  const d=$('#admd'); if(!d) return; d.ontoggle=()=>{adminPanel=d.open};
  const go2=async()=>{const e=$('#aem').value.trim(),p=$('#apw').value;if(!e||!p)return toast('請輸入 Email 和密碼');
    const b=$('#apgo');b.disabled=true;b.textContent='登入中…';
    try{const ok=await window.__fbAdmin.signIn(e,p);if(!ok){await window.__fbAdmin.signOut();toast('這個帳號沒有管理權限');}else{canAdmin=true;unlock();return}}
    catch(err){toast(/wrong-password|invalid-credential|user-not-found/.test(err.code||'')?'Email 或密碼不對':'登入失敗，請再試一次')}
    b.disabled=false;b.textContent='登入管理'};
  $('#apgo').onclick=go2; $('#apw').onkeydown=e=>{if(e.key==='Enter')go2()};
  $('#aforgot').onclick=async()=>{const e=$('#aem').value.trim();if(!e)return toast('先輸入 Email');try{await window.__fbAdmin.reset(e);toast('已寄出重設密碼信')}catch(err){toast('寄送失敗')}};
}

/* ===== 連線 ===== */
let unsubR=null;
function subResults(){
  if(!db)return; try{unsubR&&unsubR()}catch(e){} unsubR=null;
  const q=isTeacher?db.collection('results'):(player?db.collection('results').where('pid','==',player.id):null);
  if(!q){results=[];return}
  unsubR=q.onSnapshot(s=>{
    results=s.docs.map(d=>({_id:d.id,...d.data()}));
    const have=new Set(results.map(r=>r.rid));const before=local.pending.length;local.pending=local.pending.filter(r=>!have.has(r.rid));if(local.pending.length!==before)LS.set('dl_local',local);
    if(['hall','room','scores','cert'].includes(view)) render();
  },e=>{});
}
function liveRender(){
  if(['hall','room','scores','cert'].includes(view)) render();
  if(view==='bank' && !document.activeElement?.closest?.('#form') && !document.getElementById('rn_in')){ try{bankSync&&$('#form')&&bankSync()}catch(e){} render(); }
}
(async()=>{
  render();
  if(!window.claude||!claude.use){dbState='none';loadedQ=true;render();return}
  try{user=await claude.use('user')}catch(e){}
  try{if(user)canAdmin=!!(await user.isOwner())||!!(await user.canEdit())}catch(e){}
  isTeacher=canAdmin;
  try{db=await claude.use('db')}catch(e){}
  if(!db){dbState='none';loadedQ=true;render();return}
  const slow=setTimeout(()=>{if(!loadedQ){dbState='slow';render()}},10000);
  db.collection('questions').onSnapshot(s=>{
    questions=s.docs.map(d=>{const q={id:d.id,...d.data()};if(q.room==='physio')q.room='collect';return q}).filter(q=>q.type&&ROOMS[q.room]);
    if(!s.metadata.fromCache){loadedQ=true;clearTimeout(slow);dbState='ok'}
    liveRender();
  },e=>{clearTimeout(slow);dbState='none';loadedQ=true;render()});
  if(isTeacher) startAdminSubs();
  db.doc('config/surveys').onSnapshot(s=>{applySurveyConfig(s.exists?s.data():null)},e=>{});
  db.collection('shiftEvents').onSnapshot(s=>{shiftEvs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.created||0)-(b.created||0));shiftEvLoaded=true;if(view==='bank'&&bankMode==='shift'&&!document.activeElement?.closest?.('#seform'))render()},e=>{});
  db.collection('players').onSnapshot(s=>{players=s.docs.map(d=>({id:d.id,...d.data()}));if(view==='join'||(!player&&view!=='play'))render()},e=>{});
  subResults();
})();
